<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Trung Thu · Minh Châu</title>
<link rel="preload" as="image" href="assets/moon.jpg">
<link rel="preload" as="image" href="assets/flying.jpg">
<link rel="preload" as="image" href="assets/heart.jpg">
<link rel="preload" as="image" href="assets/letter.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone" aria-label="Thiệp Trung Thu">
  <main id="app" class="stage stage-moon">
    <div class="bg bg-moon"></div>
    <div class="bg bg-flying"></div>
    <div class="bg bg-heart"></div>
    <div class="bg bg-letter"></div>
    <div class="glow-stars" id="stars"></div>

    <button id="audioBtn" class="audio" aria-label="Bật/tắt nhạc">🔊</button>
    <button id="giftBtn" class="gift" aria-label="Mở lời nhắn">🎁</button>

    <div class="hold-hint">Ấn giữ vào mặt trăng</div>
    <div id="holdZone" class="hold-zone" aria-label="Mặt trăng"></div>

    <section id="floatingLayer" class="floating-layer" aria-hidden="true"></section>

    <div id="letterReveal" class="letter-reveal" aria-hidden="true">
      <button id="closeLetter" class="close-letter" aria-label="Đóng">×</button>
    </div>

    <div id="toast" class="toast"></div>
  </main>
</div>
<audio id="music" preload="auto" loop src="assets/music.mp3"></audio>
<script src="script.js"></script>
</body>
</html>
